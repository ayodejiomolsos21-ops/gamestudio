<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ahoy Survival</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; user-select:none; }
  body { background:#031326; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }
  #canvas-wrap { position:relative; width:720px; max-width:96vw; height:450px; background:#0284c7; border:3px solid #f59e0b; border-radius:14px; box-shadow:0 0 35px rgba(245,158,11,0.3); overflow:hidden; }
  canvas { width:100%; height:100%; display:block; }
  .hud { position:absolute; top:12px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .title-txt { font-size:16px; font-weight:900; color:#fef08a; letter-spacing:1.5px; text-shadow:0 2px 4px rgba(0,0,0,0.6); }
  .controls-bar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); font-size:12px; color:#fff; background:rgba(3,19,38,0.85); padding:6px 16px; border-radius:20px; border:1px solid #f59e0b; pointer-events:none; }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="c" width="720" height="450"></canvas>
  <div class="hud">
    <div class="title-txt">🏴‍☠️ AHOY SURVIVAL // OCEAN RAFT BATTLE</div>
    <div style="font-weight:bold; font-size:14px; color:#fde047;" id="score-txt">DOUBLOONS: 0 | RAFT HP: 100%</div>
  </div>
  <div class="controls-bar">[A/D] Steer Raft | [W] Row Forward | [Space/Click] Fire Broadside Cannons</div>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let ship = { x: 360, y: 225, angle: 0, speed: 0, hp: 100, gold: 0 };
  let cannons = [];
  let enemies = [];
  let floatingLoot = [];
  let keys = {};

  window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') fireCannons(); });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  canvas.addEventListener('click', fireCannons);

  function fireCannons() {
    // Port and starboard cannon balls
    const leftAngle = ship.angle - Math.PI / 2;
    const rightAngle = ship.angle + Math.PI / 2;
    cannons.push({ x: ship.x, y: ship.y, vx: Math.cos(leftAngle) * 7, vy: Math.sin(leftAngle) * 7, life: 60 });
    cannons.push({ x: ship.x, y: ship.y, vx: Math.cos(rightAngle) * 7, vy: Math.sin(rightAngle) * 7, life: 60 });
  }

  function spawnEnemy() {
    if (enemies.length < 4) {
      const a = Math.random() * Math.PI * 2;
      enemies.push({
        x: ship.x + Math.cos(a) * 400,
        y: ship.y + Math.sin(a) * 400,
        hp: 40,
        speed: 1.2
      });
    }
  }
  setInterval(spawnEnemy, 2500);

  function spawnLoot() {
    if (floatingLoot.length < 8) {
      floatingLoot.push({
        x: Math.random() * 660 + 30,
        y: Math.random() * 390 + 30,
        type: Math.random() > 0.4 ? 'gold' : 'wood'
      });
    }
  }
  setInterval(spawnLoot, 1500);

  function loop() {
    // Controls
    if (keys['KeyA'] || keys['ArrowLeft']) ship.angle -= 0.04;
    if (keys['KeyD'] || keys['ArrowRight']) ship.angle += 0.04;
    if (keys['KeyW'] || keys['ArrowUp']) ship.speed = Math.min(3.5, ship.speed + 0.1);
    else ship.speed *= 0.96;

    ship.x += Math.cos(ship.angle) * ship.speed;
    ship.y += Math.sin(ship.angle) * ship.speed;

    if (ship.x < 20) ship.x = 20; if (ship.x > 700) ship.x = 700;
    if (ship.y < 20) ship.y = 20; if (ship.y > 430) ship.y = 430;

    // Cannons
    for (let i = cannons.length - 1; i >= 0; i--) {
      let c = cannons[i];
      c.x += c.vx; c.y += c.vy; c.life--;
      if (c.life <= 0) cannons.splice(i, 1);
    }

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      const dx = ship.x - e.x, dy = ship.y - e.y;
      const angle = Math.atan2(dy, dx);
      e.x += Math.cos(angle) * e.speed;
      e.y += Math.sin(angle) * e.speed;

      // Hit by cannon
      cannons.forEach((cn, cidx) => {
        if (Math.hypot(cn.x - e.x, cn.y - e.y) < 22) {
          e.hp -= 20;
          cannons.splice(cidx, 1);
        }
      });

      if (e.hp <= 0) {
        ship.gold += 50;
        enemies.splice(i, 1);
      }
    }

    // Loot pickup
    for (let i = floatingLoot.length - 1; i >= 0; i--) {
      let l = floatingLoot[i];
      if (Math.hypot(ship.x - l.x, ship.y - l.y) < 30) {
        if (l.type === 'gold') ship.gold += 25;
        else ship.hp = Math.min(100, ship.hp + 15);
        floatingLoot.splice(i, 1);
      }
    }

    document.getElementById('score-txt').innerText = `DOUBLOONS: ${ship.gold} | RAFT HP: ${ship.hp}%`;

    // Render Ocean Waves
    ctx.fillStyle = '#0369a1';
    ctx.fillRect(0, 0, 720, 450);

    // Wave highlights
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (let y = 20; y < 450; y += 40) {
      ctx.fillRect(0, y + Math.sin(Date.now() * 0.003 + y) * 8, 720, 10);
    }

    // Loot
    floatingLoot.forEach(l => {
      ctx.font = '20px sans-serif';
      ctx.fillText(l.type === 'gold' ? '🪙' : '🪵', l.x - 10, l.y + 8);
    });

    // Cannon balls
    ctx.fillStyle = '#1e293b';
    cannons.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });

    // Enemy Sharks / Pirate ships
    enemies.forEach(e => {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.fillStyle = '#991b1b';
      ctx.fillRect(-12, -8, 24, 16);
      ctx.fillStyle = '#000';
      ctx.fillText('☠️', -8, 5);
      ctx.restore();
    });

    // Player Raft
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    ctx.fillStyle = '#78350f'; // Wooden raft
    ctx.fillRect(-16, -12, 32, 24);
    ctx.fillStyle = '#fef08a'; // Sail
    ctx.beginPath();
    ctx.moveTo(4, -8); ctx.lineTo(14, 0); ctx.lineTo(4, 8);
    ctx.fill();
    ctx.restore();

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
