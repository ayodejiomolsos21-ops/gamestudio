<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Agar.io Lite</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; user-select:none; }
  body { background:#0f172a; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }
  #canvas-wrap { position:relative; width:720px; max-width:96vw; height:450px; background:#f8fafc; border:2px solid #6366f1; border-radius:14px; box-shadow:0 0 35px rgba(99,102,241,0.3); overflow:hidden; }
  canvas { width:100%; height:100%; display:block; cursor:crosshair; }
  .hud { position:absolute; top:12px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .hud-title { font-size:16px; font-weight:900; color:#4f46e5; letter-spacing:1px; }
  .controls-bar { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:12px; color:#475569; background:rgba(255,255,255,0.9); padding:4px 14px; border-radius:20px; border:1px solid #cbd5e1; pointer-events:none; }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="c" width="720" height="450"></canvas>
  <div class="hud">
    <div class="hud-title">🦠 AGAR.IO LITE // BATTLE CELL</div>
    <div style="font-weight:bold; font-size:14px; color:#4f46e5;" id="score-txt">SCORE: 20 | LEADER: #1 You</div>
  </div>
  <div class="controls-bar">Move Mouse to Guide Cell | [Space] Split Mass | [W] Eject Pellet</div>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let player = { x: 360, y: 225, r: 18, color: '#6366f1', name: 'You' };
  let target = { x: 360, y: 225 };
  let food = [];
  let bots = [];
  let score = 20;

  for (let i = 0; i < 80; i++) {
    food.push({
      x: Math.random() * 700 + 10,
      y: Math.random() * 430 + 10,
      r: 3.5,
      color: ['#ef4444', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6', '#ec4899'][Math.floor(Math.random() * 6)]
    });
  }

  for (let i = 0; i < 6; i++) {
    bots.push({
      x: Math.random() * 700 + 10,
      y: Math.random() * 430 + 10,
      r: Math.random() * 16 + 12,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      color: ['#f43f5e', '#3b82f6', '#10b981', '#eab308'][i % 4],
      name: ['Apex', 'Vortex', 'Blobby', 'Titan', 'Cosmo', 'Nebula'][i]
    });
  }

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    target.x = (e.clientX - rect.left) * (720 / rect.width);
    target.y = (e.clientY - rect.top) * (450 / rect.height);
  });

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      player.r = Math.max(12, player.r * 0.85);
    }
  });

  function loop() {
    // Player move towards cursor
    const dx = target.x - player.x, dy = target.y - player.y;
    const dist = Math.hypot(dx, dy);
    const speed = Math.max(1.2, 5 - (player.r / 20));
    if (dist > 5) {
      player.x += (dx / dist) * speed;
      player.y += (dy / dist) * speed;
    }

    // Bounds
    player.x = Math.max(player.r, Math.min(720 - player.r, player.x));
    player.y = Math.max(player.r, Math.min(450 - player.r, player.y));

    // Eat food
    for (let i = food.length - 1; i >= 0; i--) {
      let f = food[i];
      if (Math.hypot(player.x - f.x, player.y - f.y) < player.r) {
        player.r = Math.min(65, player.r + 0.35);
        score += 10;
        food[i] = {
          x: Math.random() * 700 + 10,
          y: Math.random() * 430 + 10,
          r: 3.5,
          color: ['#ef4444', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6'][Math.floor(Math.random() * 5)]
        };
      }
    }

    // Bot logic
    bots.forEach(b => {
      b.x += b.vx; b.y += b.vy;
      if (b.x < b.r || b.x > 720 - b.r) b.vx *= -1;
      if (b.y < b.r || b.y > 450 - b.r) b.vy *= -1;

      // Eat / get eaten
      const d = Math.hypot(player.x - b.x, player.y - b.y);
      if (d < player.r && player.r > b.r * 1.15) {
        player.r = Math.min(65, player.r + b.r * 0.25);
        score += Math.floor(b.r * 25);
        b.x = Math.random() * 700; b.y = Math.random() * 430; b.r = 14;
      }
    });

    document.getElementById('score-txt').innerText = `SCORE: ${score} (Mass: ${Math.floor(player.r * 2)})`;

    // Render Grid
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, 0, 720, 450);

    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    for (let x = 0; x < 720; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 450); ctx.stroke(); }
    for (let y = 0; y < 450; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(720, y); ctx.stroke(); }

    // Food
    food.forEach(f => {
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Bots
    bots.forEach(b => {
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(b.name, b.x, b.y + 3);
    });

    // Player
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#4338ca';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('You', player.x, player.y + 4);

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
