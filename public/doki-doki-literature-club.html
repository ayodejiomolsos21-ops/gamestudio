<!doctype html>
<html lang="en-us">

<head>
  <base href="https://emeraldgreenr.github.io/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Doki Doki Literature Club! (Ren'Py Mod)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
  <link rel="icon" href="icons/icon-72x72.png" sizes="72x72" type="image/png" />
  <link rel="icon" href="icons/icon-96x96.png" sizes="96x96" type="image/png" />
  <link rel="icon" href="icons/icon-128x128.png" sizes="128x128" type="image/png" />
  <link rel="icon" href="icons/icon-144x144.png" sizes="144x144" type="image/png" />
  <link rel="icon" href="icons/icon-152x152.png" sizes="152x152" type="image/png" />
  <link rel="icon" href="icons/icon-192x192.png" sizes="192x192" type="image/png" />
  <link rel="icon" href="icons/icon-384x384.png" sizes="384x384" type="image/png" />
  <link rel="icon" href="icons/icon-512x512.png" sizes="512x512" type="image/png" />
  <!-- ios support -->
  <link rel="apple-touch-icon" href="icons/icon-72x72.png" sizes="72x72" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-96x96.png" sizes="96x96" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-128x128.png" sizes="128x128" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-144x144.png" sizes="144x144" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-152x152.png" sizes="152x152" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-384x384.png" sizes="384x384" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-512x512.png" sizes="512x512" type="image/png" />

  <meta name="theme-color" content="#000" />

  <style>
    html {
      background: #222;
      font-family: sans-serif;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #111;
    }

    #canvas, #overlayDiv {
      position: absolute;
      top: 0px;
      left: 0px;

      width: 100%;
      height: 100%;

      border: 0 none;
    }

    #canvas {
      background: #000;
    }

    .visible {
      visibility: visible;
      opacity: 1.0;
      transition: opacity .1s linear;
    }

    .hidden {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s .25s, opacity .25s linear;
    }

    #statusDiv, #inputDiv {
      background: rgba(0, 0, 0, 0.85);
      width: 50%;
      margin: auto;
      min-width: 340px;
      padding: 12px;

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      border-radius: 0 0 8px 8px;
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #statusTextDiv {
      overflow: auto;
      max-height: 40vh;
      color: #ffd6e7;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    #statusProgress {
      display: none;
      width: 100%;
      height: 10px;
      margin-top: 8px;
      border-radius: 5px;
      accent-color: #ff69b4;
    }

    #inputDiv {
      width: 65%;
      padding-left: 10px;
      padding-right: 20px;
      z-index: 100;
    }

    #inputPrompt {
      color: #eee;
      font-size: 150%;
      margin-bottom: 1em;
      margin-top: 1em;
    }

    #inputText {
      width: 100%;
      font-size: 175%;
      padding: 5px;
      background: inherit;
      color: #eee;
    }

    #inputText:focus {
      color: #ffffff;
    }

    #ContextContainer {
      position: absolute;
      left: 0px;
      top: 0px;
      color: white;
      z-index: 50;
    }

    #ContextContainer.shown {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 0px 0px 8px 0px;
    }

    #ContextButton {
      text-decoration: none;
      color: #ffb6c1;
      font-size: xx-large;
      cursor: pointer;
      user-select: none;
      -moz-user-select: none;
      padding: 10px 14px;
      opacity: .85;
      display: inline-block;
    }

    #ContextButton:hover {
      opacity: 1;
      color: #fff;
    }

    #ContextMenu a {
      text-decoration: none;
      color: #ffe4e1;
      background: #2b1f28;
      height: 44px;
      width: 240px;
      border-radius: 6px;
      border: 1px solid #ff7597;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 6px 8px;
      font-size: 14px;
      font-weight: 500;
      opacity: 1.0;
      transition: all 0.2s;
    }

    #ContextMenu a:hover {
      text-decoration: none;
      background: #ff7597;
      color: #ffffff;
    }

    #presplash {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        margin: auto;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #111;
        z-index: 10;
    }
  </style>
</head>

<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
  <div id="overlayDiv"></div>

  <img id="presplash" src="web-presplash.jpg" alt="Loading Doki Doki Literature Club...">

  <div id="ContextContainer">
    <a id="ContextButton" onclick="toggleContext()">&#8801;</a><br />
    <div id="ContextMenu" style="display: none;">
      <input id="ID_SavegamesImport" type="file" onchange="onSavegamesImport(this)" accept="application/zip"
        style="display:none"></input>
      <a href="javascript:document.getElementById('ID_SavegamesImport').click();">📥 Import Saves</a>
      <a href="javascript:onSavegamesExport();">💾 Export Saves</a>
      <a href="javascript:FSDownload('/log.txt', 'text/plain');">📄 Download Log</a>
      <a href="https://www.renpy.org/" target="_blank">
          🌸 Powered by Ren'Py
      </a>
    </div>
  </div>

  <div id="statusDiv" class="hidden">
    <div id="statusTextDiv">Loading Doki Doki Literature Club...</div>
    <progress id="statusProgress" value="0" max="100"></progress>
  </div>

  <div id="inputDiv" class="hidden">
    <form id="inputForm">
      <div id="inputPrompt"></div>
      <input id="inputText" type="text">
    </form>
  </div>

  <script>
      function toggleContext() {
        const menu = document.getElementById('ContextMenu');
        const container = document.getElementById('ContextContainer');
        if (menu.style.display === 'none' || !menu.style.display) {
          menu.style.display = 'block';
          container.classList.add('shown');
        } else {
          menu.style.display = 'none';
          container.classList.remove('shown');
        }
      }

      // The URL to game.zip, relative to the URL of this file.
      window.gameZipURL = 'game.zip';

      // Register the service worker if available
      if (navigator.serviceWorker) {
          if (!navigator.serviceWorker.controller) {
              navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'all' }).catch(function(e) {
                console.log('SW registration skipped or blocked:', e);
              });
          }
      }
  </script>
  <script src="renpy-pre.js"></script>
  <script async type="text/javascript" src="renpy.js"></script>
</body>

</html>
