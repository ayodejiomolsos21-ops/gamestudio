<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ages of Conflict</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; user-select:none; }
  body { background:#0a0e1a; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }
  #canvas-wrap { position:relative; width:720px; max-width:96vw; height:450px; background:#071226; border:2px solid #38bdf8; border-radius:14px; box-shadow:0 0 35px rgba(56,189,248,0.25); overflow:hidden; }
  canvas { width:100%; height:100%; display:block; cursor:pointer; }
  .hud { position:absolute; top:12px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .title-txt { font-size:16px; font-weight:900; color:#38bdf8; letter-spacing:1px; }
  .controls-bar { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:12px; color:#94a3b8; background:rgba(10,14,26,0.9); padding:4px 16px; border-radius:20px; border:1px solid #334155; pointer-events:none; }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="c" width="720" height="450"></canvas>
  <div class="hud">
    <div class="title-txt">🗺️ AGES OF CONFLICT // WORLD MAP SIMULATOR</div>
    <div style="font-weight:bold; font-size:14px; color:#22c55e;" id="year-txt">YEAR: 1450 CE | NATIONS: 8</div>
  </div>
  <div class="controls-bar">Click any territory to Revolt / Spawn Nation | Simulation runs in real-time</div>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let year = 1450;
  const cols = 24, rows = 15;
  const cellW = 720 / cols, cellH = 450 / rows;
  let grid = [];

  const nations = [
    { id: 1, name: 'Valoria', color: '#ef4444' },
    { id: 2, name: 'Nordia', color: '#3b82f6' },
    { id: 3, name: 'Sylvania', color: '#10b981' },
    { id: 4, name: 'Solara', color: '#f59e0b' },
    { id: 5, name: 'Aethel', color: '#8b5cf6' },
    { id: 6, name: 'Kush', color: '#ec4899' },
    { id: 7, name: 'Celtica', color: '#06b6d4' },
    { id: 8, name: 'Sarmatia', color: '#84cc16' }
  ];

  // Initialize Map grid with natural water & land
  for (let r = 0; r < rows; r++) {
    grid[r] = [];
    for (let c = 0; c < cols; c++) {
      const isWater = (r === 0 || r === rows - 1 || c === 0 || c === cols - 1 || Math.random() < 0.2);
      const owner = isWater ? 0 : Math.floor(Math.random() * nations.length) + 1;
      grid[r][c] = { water: isWater, nation: owner, power: Math.floor(Math.random() * 50) + 20 };
    }
  }

  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const c = Math.floor(((e.clientX - rect.left) * (720 / rect.width)) / cellW);
    const r = Math.floor(((e.clientY - rect.top) * (450 / rect.height)) / cellH);
    if (grid[r] && grid[r][c] && !grid[r][c].water) {
      grid[r][c].nation = Math.floor(Math.random() * nations.length) + 1;
      grid[r][c].power = 100;
    }
  });

  function simulate() {
    year += 5;
    for (let r = 1; r < rows - 1; r++) {
      for (let c = 1; c < cols - 1; c++) {
        const cell = grid[r][c];
        if (cell.water || cell.nation === 0) continue;

        // Spread to neighbor
        const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        const [dr, dc] = dirs[Math.floor(Math.random() * 4)];
        const target = grid[r + dr][c + dc];

        if (target && !target.water) {
          if (target.nation !== cell.nation) {
            if (cell.power > target.power * 0.9) {
              target.nation = cell.nation;
              target.power = Math.floor(cell.power * 0.7);
            }
          } else {
            cell.power = Math.min(150, cell.power + 2);
          }
        }
      }
    }

    // Count alive nations
    const alive = new Set();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (grid[r][c].nation > 0) alive.add(grid[r][c].nation);
      }
    }
    document.getElementById('year-txt').innerText = `YEAR: ${year} CE | ACTIVE EMPIRES: ${alive.size}`;
  }
  setInterval(simulate, 1200);

  function render() {
    ctx.fillStyle = '#050b14';
    ctx.fillRect(0, 0, 720, 450);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = grid[r][c];
        if (cell.water) {
          ctx.fillStyle = '#0284c7';
        } else {
          const nat = nations.find(n => n.id === cell.nation);
          ctx.fillStyle = nat ? nat.color : '#334155';
        }
        ctx.fillRect(c * cellW, r * cellH, cellW - 1, cellH - 1);
      }
    }

    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
