<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Angry Birds Slingshot Frenzy</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; user-select:none; }
  body { background:#0f172a; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }
  #canvas-wrap { position:relative; width:720px; max-width:96vw; height:450px; background:linear-gradient(180deg, #f97316 0%, #fbbf24 65%, #15803d 65%, #14532d 100%); border:2px solid #ef4444; border-radius:14px; box-shadow:0 0 35px rgba(239,68,68,0.3); overflow:hidden; }
  canvas { width:100%; height:100%; display:block; cursor:crosshair; }
  .hud { position:absolute; top:12px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .title-txt { font-size:16px; font-weight:900; color:#fff; letter-spacing:1px; text-shadow:0 2px 4px rgba(0,0,0,0.5); }
  .controls-bar { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:12px; color:#fff; background:rgba(15,23,42,0.85); padding:4px 16px; border-radius:20px; border:1px solid #ef4444; pointer-events:none; }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="c" width="720" height="450"></canvas>
  <div class="hud">
    <div class="title-txt">🔥 SLINGSHOT FRENZY // RAPID FIRE TARGETS</div>
    <div style="font-weight:bold; font-size:14px; color:#fde047;" id="score-txt">FRENZY SCORE: 0 | TARGETS POPPED: 0</div>
  </div>
  <div class="controls-bar">Click Anywhere to Rapidly Shoot Mini Red Birds at Flying Targets!</div>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let birds = [];
  let targets = [];
  let score = 0;
  let popped = 0;

  function spawnTarget() {
    if (targets.length < 8) {
      targets.push({
        x: Math.random() * 300 + 360,
        y: Math.random() * 200 + 40,
        r: Math.random() * 8 + 14,
        vy: (Math.random() - 0.5) * 2,
        vx: (Math.random() - 0.5) * 1.5,
        type: Math.random() > 0.3 ? 'pig' : 'goldenEgg'
      });
    }
  }
  setInterval(spawnTarget, 900);

  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (720 / rect.width);
    const my = (e.clientY - rect.top) * (450 / rect.height);
    const angle = Math.atan2(my - 260, mx - 80);
    birds.push({
      x: 80, y: 260,
      vx: Math.cos(angle) * 14,
      vy: Math.sin(angle) * 14,
      r: 8
    });
  });

  function loop() {
    // Birds
    for (let i = birds.length - 1; i >= 0; i--) {
      let b = birds[i];
      b.x += b.vx;
      b.y += b.vy;

      // Target collision
      for (let j = targets.length - 1; j >= 0; j--) {
        let t = targets[j];
        if (Math.hypot(b.x - t.x, b.y - t.y) < b.r + t.r) {
          popped++;
          score += t.type === 'goldenEgg' ? 1000 : 250;
          targets.splice(j, 1);
          birds.splice(i, 1);
          break;
        }
      }

      if (b && (b.x > 730 || b.y < -10 || b.y > 460)) birds.splice(i, 1);
    }

    // Targets floating
    targets.forEach(t => {
      t.y += t.vy;
      t.x += t.vx;
      if (t.y < 30 || t.y > 280) t.vy *= -1;
      if (t.x < 360 || t.x > 690) t.vx *= -1;
    });

    document.getElementById('score-txt').innerText = `FRENZY SCORE: ${score} | TARGETS POPPED: ${popped}`;

    // Render
    ctx.clearRect(0, 0, 720, 450);

    // Slingshot base
    ctx.fillStyle = '#78350f';
    ctx.fillRect(72, 260, 16, 50);

    // Targets
    targets.forEach(t => {
      if (t.type === 'goldenEgg') {
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.ellipse(t.x, t.y, t.r * 0.8, t.r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillText('✨', t.x - 6, t.y + 4);
      } else {
        ctx.fillStyle = '#84cc16';
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.fillText('🐷', t.x - 7, t.y + 4);
      }
    });

    // Bullets (Mini Red Birds)
    birds.forEach(b => {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    });

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
