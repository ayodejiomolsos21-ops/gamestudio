<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Angry Birds Online</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; user-select:none; }
  body { background:#0f172a; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }
  #canvas-wrap { position:relative; width:720px; max-width:96vw; height:450px; background:linear-gradient(180deg, #0284c7 0%, #38bdf8 65%, #16a34a 65%, #15803d 100%); border:2px solid #38bdf8; border-radius:14px; box-shadow:0 0 35px rgba(56,189,248,0.3); overflow:hidden; }
  canvas { width:100%; height:100%; display:block; cursor:crosshair; }
  .hud { position:absolute; top:12px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .title-txt { font-size:16px; font-weight:900; color:#fff; letter-spacing:1px; text-shadow:0 2px 4px rgba(0,0,0,0.5); }
  .controls-bar { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:12px; color:#fff; background:rgba(15,23,42,0.85); padding:4px 16px; border-radius:20px; border:1px solid #38bdf8; pointer-events:none; }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="c" width="720" height="450"></canvas>
  <div class="hud">
    <div class="title-txt">🌐 ANGRY BIRDS ONLINE // GLOBAL LEAGUE</div>
    <div style="font-weight:bold; font-size:14px; color:#fde047;" id="score-txt">STARS: ⭐⭐⭐ | HIGH SCORE: 42,000</div>
  </div>
  <div class="controls-bar">Drag Slingshot to Destroy All Pig Towers!</div>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const sling = { x: 120, y: 260 };
  let bird = { x: 120, y: 260, r: 16, vx: 0, vy: 0, launched: false };
  let dragging = false;
  let score = 0;

  let towers = [
    { x: 440, y: 200, w: 24, h: 100, hp: 50 },
    { x: 530, y: 160, w: 24, h: 140, hp: 60 },
    { x: 620, y: 220, w: 24, h: 80, hp: 40 }
  ];

  let pigs = [
    { x: 452, y: 180, r: 12, alive: true },
    { x: 542, y: 140, r: 14, alive: true },
    { x: 632, y: 200, r: 12, alive: true }
  ];

  canvas.addEventListener('mousedown', e => {
    if (!bird.launched) {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (720 / rect.width);
      const my = (e.clientY - rect.top) * (450 / rect.height);
      if (Math.hypot(mx - sling.x, my - sling.y) < 40) dragging = true;
    }
  });

  canvas.addEventListener('mousemove', e => {
    if (dragging && !bird.launched) {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (720 / rect.width);
      const my = (e.clientY - rect.top) * (450 / rect.height);
      const angle = Math.atan2(my - sling.y, mx - sling.x);
      const dist = Math.min(65, Math.hypot(mx - sling.x, my - sling.y));
      bird.x = sling.x + Math.cos(angle) * dist;
      bird.y = sling.y + Math.sin(angle) * dist;
    }
  });

  canvas.addEventListener('mouseup', () => {
    if (dragging && !bird.launched) {
      dragging = false;
      bird.launched = true;
      bird.vx = (sling.x - bird.x) * 0.3;
      bird.vy = (sling.y - bird.y) * 0.3;
    }
  });

  function resetBird() {
    bird = { x: 120, y: 260, r: 16, vx: 0, vy: 0, launched: false };
  }

  function loop() {
    if (bird.launched) {
      bird.vy += 0.45;
      bird.x += bird.vx;
      bird.y += bird.vy;

      if (bird.y > 290) {
        bird.y = 290;
        bird.vy = -bird.vy * 0.4;
        bird.vx *= 0.8;
      }

      towers.forEach(t => {
        if (bird.x + bird.r > t.x && bird.x - bird.r < t.x + t.w &&
            bird.y + bird.r > t.y && bird.y - bird.r < t.y + t.h) {
          t.hp -= Math.hypot(bird.vx, bird.vy) * 5;
          bird.vx *= 0.6;
        }
      });

      pigs.forEach(p => {
        if (p.alive && Math.hypot(bird.x - p.x, bird.y - p.y) < bird.r + p.r) {
          p.alive = false;
          score += 6000;
        }
      });

      if (bird.x > 750 || (Math.abs(bird.vx) < 0.2 && Math.abs(bird.vy) < 0.2 && bird.y >= 290)) {
        setTimeout(resetBird, 1500);
      }
    }

    const alivePigs = pigs.filter(p => p.alive).length;
    document.getElementById('score-txt').innerText = `SCORE: ${score} | PIGS: ${alivePigs} REMAINING`;

    // Render
    ctx.clearRect(0, 0, 720, 450);

    // Slingshot
    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(sling.x - 10, sling.y);
    ctx.lineTo(bird.x, bird.y);
    ctx.lineTo(sling.x + 10, sling.y);
    ctx.stroke();

    ctx.fillStyle = '#78350f';
    ctx.fillRect(sling.x - 8, sling.y, 16, 60);

    // Towers
    towers.forEach(t => {
      if (t.hp > 0) {
        ctx.fillStyle = '#b45309';
        ctx.fillRect(t.x, t.y, t.w, t.h);
      }
    });

    // Pigs
    pigs.forEach(p => {
      if (p.alive) {
        ctx.fillStyle = '#84cc16';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // Bird
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2);
    ctx.fill();

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
