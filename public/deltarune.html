<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Deltarune - Ultimate Game Stash</title>
  <!-- Ultimate Game Stash file--> 
  <!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c084fc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(192, 132, 252, 0.2);
      border-top-color: #c084fc;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div style="font-weight: 700; font-size: 16px; letter-spacing: 1px;">LOADING DELTARUNE...</div>
    <div style="font-size: 12px; color: #94a3b8;">Ultimate Game Stash • Dark World</div>
  </div>

  <script>
    launch();

    function launch() {
      try {
        fetch("https://cdn.jsdelivr.net/gh/regedit-sys/web-port@main/deltarune/free.html?t=" + Date.now())
          .then(response => {
            if (!response.ok) throw new Error('Network response was not ok');
            return response.text();
          })
          .then(html => {
            document.documentElement.innerHTML = html;

            document.documentElement.querySelectorAll('script').forEach(oldScript => {
              const newScript = document.createElement('script');
              if (oldScript.src) {
                newScript.src = oldScript.src;
              } else {
                newScript.textContent = oldScript.textContent;
              }
              // Copy over attributes
              Array.from(oldScript.attributes).forEach(attr => {
                if (attr.name !== 'src') {
                  newScript.setAttribute(attr.name, attr.value);
                }
              });
              document.body.appendChild(newScript);
            });
          })
          .catch(error => {
            console.error('Deltarune load error:', error);
            const loader = document.getElementById('loader');
            if (loader) {
              loader.innerHTML = '<div style="color:#f87171;font-weight:bold;font-size:16px;">Failed to load Deltarune</div><div style="color:#94a3b8;font-size:12px;margin-top:6px;">Check internet connection and try reloading.</div>';
            }
          });
      } catch (error) {
        console.error('error:', error);
      }
    }
  </script>
</body>
</html>
