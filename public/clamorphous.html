<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Amorphous +</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; user-select:none; }
  body { background:#0f172a; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }
  #canvas-wrap { position:relative; width:720px; max-width:96vw; height:450px; background:#1e293b; border:2px solid #e2e8f0; border-radius:14px; box-shadow:0 0 35px rgba(255,255,255,0.2); overflow:hidden; }
  canvas { width:100%; height:100%; display:block; cursor:crosshair; }
  .hud { position:absolute; top:12px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  .title-txt { font-size:16px; font-weight:900; color:#f8fafc; letter-spacing:1px; }
  .controls-bar { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:12px; color:#94a3b8; background:rgba(15,23,42,0.9); padding:4px 16px; border-radius:20px; border:1px solid #334155; pointer-events:none; }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="c" width="720" height="450"></canvas>
  <div class="hud">
    <div class="title-txt">⚔️ AMORPHOUS + // SPLAT BLADE ARENA</div>
    <div style="font-weight:bold; font-size:14px; color:#38bdf8;" id="score-txt">SPLAT COMBO: 0x | SCORE: 0</div>
  </div>
  <div class="controls-bar">[WASD] Move Knight | Aim & Click Mouse to Swing Giant Splat Blade</div>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let player = { x: 360, y: 225, vx: 0, vy: 0, swordAngle: 0, swinging: 0 };
  let mouse = { x: 360, y: 225 };
  let gloops = [];
  let splatters = [];
  let score = 0;
  let combo = 0;
  let keys = {};

  for (let i = 0; i < 6; i++) {
    spawnGloop();
  }

  function spawnGloop() {
    gloops.push({
      x: Math.random() > 0.5 ? 20 : 700,
      y: Math.random() * 400 + 20,
      r: Math.random() * 12 + 10,
      color: ['#ef4444', '#10b981', '#3b82f6', '#f59e0b'][Math.floor(Math.random() * 4)]
    });
  }

  window.addEventListener('keydown', e => { keys[e.code] = true; });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) * (720 / rect.width);
    mouse.y = (e.clientY - rect.top) * (450 / rect.height);
  });
  canvas.addEventListener('click', () => { player.swinging = 12; });

  function loop() {
    if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -4.5;
    else if (keys['KeyD'] || keys['ArrowRight']) player.vx = 4.5;
    else player.vx *= 0.8;

    if (keys['KeyW'] || keys['ArrowUp']) player.vy = -4.5;
    else if (keys['KeyS'] || keys['ArrowDown']) player.vy = 4.5;
    else player.vy *= 0.8;

    player.x += player.vx; player.y += player.vy;
    player.x = Math.max(30, Math.min(690, player.x));
    player.y = Math.max(30, Math.min(420, player.y));

    player.swordAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

    // Gloops
    if (gloops.length < 8 && Math.random() < 0.04) spawnGloop();

    for (let i = gloops.length - 1; i >= 0; i--) {
      let g = gloops[i];
      const dx = player.x - g.x, dy = player.y - g.y;
      const angle = Math.atan2(dy, dx);
      g.x += Math.cos(angle) * 1.5;
      g.y += Math.sin(angle) * 1.5;

      // Sword strike
      if (player.swinging > 0) {
        const bladeX = player.x + Math.cos(player.swordAngle) * 45;
        const bladeY = player.y + Math.sin(player.swordAngle) * 45;
        if (Math.hypot(bladeX - g.x, bladeY - g.y) < g.r + 30) {
          // Splat!
          for (let s = 0; s < 12; s++) {
            splatters.push({ x: g.x, y: g.y, r: Math.random() * 8 + 3, color: g.color });
          }
          combo++;
          score += combo * 100;
          gloops.splice(i, 1);
        }
      }
    }

    if (player.swinging > 0) player.swinging--;

    document.getElementById('score-txt').innerText = `SPLAT COMBO: ${combo}x | SCORE: ${score}`;

    // Render Arena
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, 720, 450);

    // Floor splatters
    splatters.forEach(s => {
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Gloops
    gloops.forEach(g => {
      ctx.fillStyle = g.color;
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Player Knight
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.arc(player.x, player.y, 12, 0, Math.PI * 2);
    ctx.fill();

    // Giant Buster Sword
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.swordAngle + (player.swinging > 0 ? (player.swinging - 6) * 0.2 : 0));
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(10, -4, 45, 8);
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(10, -2, 45, 4);
    ctx.restore();

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
